[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "robotwin-phys-reproduction"
version = "0.1.0"
description = "Paper-based RoboTwin-Phys reproduction with frozen evaluation manifests"
requires-python = ">=3.10,<3.11"
dependencies = ["numpy==1.26.4", "PyYAML==6.0.2", "Pillow>=10,<12"]

[project.scripts]
robotwin-phys = "robotwin_phys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: requires installed SAPIEN, CUDA, assets and GPU"]
